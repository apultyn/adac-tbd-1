requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.2",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "kagglehub>=1.0.1",
    "memory-profiler>=0.61.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
    "pandas==3.0.2",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "pyspark>=4.1.1",
